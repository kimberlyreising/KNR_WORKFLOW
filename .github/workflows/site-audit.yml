name: Verify KNR SEO bundle patch on staging
on:
  push:
    branches:
      - seo-bundle-staging-2026-10-27
permissions:
  contents: write
jobs:
  import-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout original KNR site snapshot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Apply the uploaded SEO patch to its original base and verify against the supplied bundle
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:knr-seo-patch.patch > "$RUNNER_TEMP/knr-seo-patch.patch"
          echo "PATCH STATISTICS:"
          git apply --stat "$RUNNER_TEMP/knr-seo-patch.patch"
          git apply --check "$RUNNER_TEMP/knr-seo-patch.patch"
          git apply --binary "$RUNNER_TEMP/knr-seo-patch.patch"
          # Restore the original audit workflow from the shared base:
          # this temporary test workflow must never appear on the live site.
          git checkout 9b53d07ded413a1d4200d33df67899dd44423c63 -- .github/workflows/site-audit.yml
          git add -A
          actual="$(git write-tree)"
          expected="fcf9f295fb7e3c8e01153498e282e0e54109b75d"
          echo "Applied patch tree: $actual"
          echo "Bundle snapshot tree: $expected"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::The uploaded patch does not produce the same source tree as the Git bundle. Do not integrate blindly."
            git status --short
            exit 1
          fi
          echo "PASS: Uploaded patch and the provided Git bundle contain exactly identical website files."
          echo "CHECK: Preserve originals and inspect SEO changes before merge to main."
      - name: Commit exact verified bundle contents on staging branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "KNR Studio Verification"
          git config user.email "knr-verification@users.noreply.github.com"
          git commit -m "Stage verified KNR SEO performance bundle without publishing"
          git push origin HEAD:seo-bundle-staging-2026-10-27
