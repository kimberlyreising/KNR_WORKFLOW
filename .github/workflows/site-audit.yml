name: Import exact KNR SEO performance bundle on staging
on:
  push:
    branches:
      - seo-bundle-staging-2026-10-27
permissions:
  contents: write
jobs:
  verify-and-import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout KNR staging
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify uploaded bundle and create a separate import branch
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/knr-seo-performance.bundle"
          git fetch origin main
          git show origin/main:knr-seo-performance.bundle > "$bundle"
          test -s "$bundle"
          echo "Retrieved bundle uploaded to main, without applying anything to main."
          echo "Found Git bundle at: $bundle"
          git bundle list-heads "$bundle"
          git bundle verify "$bundle"
          git fetch "$bundle" refs/heads/seo-performance-2026-10
          actual_commit="$(git rev-parse FETCH_HEAD)"
          expected_commit="be5696f30b9f98452bb4ba1b92987dc40fefed71"
          actual_tree="$(git rev-parse "FETCH_HEAD^{tree}")"
          expected_tree="fcf9f295fb7e3c8e01153498e282e0e54109b75d"
          echo "Actual bundle tip: $actual_commit"
          echo "Actual bundle tree: $actual_tree"
          if [[ "$actual_commit" != "$expected_commit" || "$actual_tree" != "$expected_tree" ]]; then
            echo "::error::Bundle identity does not match the previously inspected original. Import refused."
            exit 1
          fi
          if git ls-remote --exit-code origin refs/heads/seo-bundle-imported-2026-10-27 >/dev/null; then
            echo "Verified import branch already exists; refusing to overwrite."
          else
            git push origin "$actual_commit:refs/heads/seo-bundle-imported-2026-10-27"
            echo "Imported exact bundle contents to seo-bundle-imported-2026-10-27; main was not touched."
          fi
